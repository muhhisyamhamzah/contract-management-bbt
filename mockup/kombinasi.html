<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contoh kombinasi gaya tabel</title>
<!-- Buka dengan ?k=1 sampai ?k=4. Data fiktif ("Contoh"). Hanya mockup, bukan kode aplikasi. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,500&display=swap">
<link rel="stylesheet" href="tabel-gaya.css">
<style>
  .wadah { padding-top:0; }
  .bg-mozaik { position:absolute; inset:0 0 auto 0; height:300px; display:grid; gap:6px; padding:6px; overflow:hidden;
    -webkit-mask-image:linear-gradient(#000 25%,transparent 95%); mask-image:linear-gradient(#000 25%,transparent 95%); pointer-events:none; }
  .bg-mozaik i { aspect-ratio:1; border-radius:10px; }
  .halaman { position:relative; }
  .halaman .isi { position:relative; max-width:1120px; margin:0 auto; padding:24px 24px 40px; }
  /* Navbar pilihan C: logo tetap tapi rapi, judul besar */
  .nav { position:sticky; top:12px; z-index:5; display:flex; align-items:center; gap:22px; background:#fff; border:1px solid var(--garis); border-radius:22px; padding:10px 10px 10px 20px; box-shadow:0 12px 32px -18px rgb(19 37 79 / .35); }
  .merek { display:flex; align-items:center; gap:16px; }
  .merek img { height:46px; display:block; }
  .merek .garis-v { width:1px; height:36px; background:var(--garis); }
  .merek b { font-size:22px; font-weight:800; letter-spacing:-.03em; color:var(--navy); white-space:nowrap; }
  .menu { display:flex; gap:2px; margin:0 auto; }
  .menu a { padding:0 14px; min-height:44px; display:inline-flex; align-items:center; gap:6px; border-radius:99px; color:var(--teks); text-decoration:none; font-weight:500; }
  .menu a.aktif { background:var(--sorot); color:var(--navy); font-weight:700; }
  .jml { background:var(--emas); color:var(--navy); font-size:11px; font-weight:700; border-radius:99px; padding:0 6px; }
  .kanan-nav { display:flex; align-items:center; gap:8px; }
  .av { width:40px; height:40px; border-radius:99px; background:var(--sorot); display:grid; place-items:center; font-weight:700; font-size:13px; color:var(--navy); }
  .tombol { background:var(--navy); color:#fff; border-radius:99px; height:48px; padding:0 22px; display:inline-flex; align-items:center; gap:8px; font-weight:600; white-space:nowrap; }
  .pembuka { text-align:center; padding:84px 0 0; }
  .pembuka p.tgl { margin:0; color:var(--lembut); }
  .pembuka h1 { font-size:56px; line-height:1.05; margin:8px auto 0; max-width:900px; }
  .pembuka .ring { color:var(--lembut); font-size:16px; margin:12px 0 0; }
  .cari { display:flex; align-items:center; gap:8px; max-width:560px; margin:24px auto 0; background:#fff; border:1px solid #7D88A3; border-radius:99px; padding:6px 6px 6px 22px; box-shadow:0 12px 32px -18px rgb(19 37 79 / .35); }
  .cari span { flex:1; text-align:left; color:var(--lembut); }
  .cari em { font-style:normal; background:var(--aksi); color:#fff; border-radius:99px; padding:12px 22px; font-weight:600; }
  .pil-status { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:18px 0 0; }
  .pil-status span { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 16px; border-radius:99px; background:#fff; border:1px solid var(--garis); }
  .pil-status b { font-size:16px; color:var(--navy); }
  .bagian { margin-top:40px; }
  .pemisah { display:flex; align-items:center; gap:14px; max-width:1120px; margin:56px auto 0; padding:0 24px; color:var(--lembut); font-weight:600; }
  .pemisah::before, .pemisah::after { content:""; flex:1; height:1px; background:var(--garis); }
  .judul-hal { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding:36px 0 18px; }
  .judul-hal h1 { font-size:30px; margin:0; }
  .judul-hal p { margin:4px 0 0; color:var(--lembut); }
  .chip { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 18px; }
  .chip span { border:1px solid var(--garis); background:#fff; border-radius:99px; padding:8px 14px; font-weight:600; font-size:13px; }
  .chip span.aktif { border-color:var(--navy); background:var(--sorot); color:var(--navy); }
  .label-kombinasi { position:fixed; right:16px; bottom:16px; z-index:9; background:var(--navy); color:#fff; border-radius:99px; padding:10px 18px; font-weight:700; box-shadow:0 12px 28px -12px rgb(19 37 79 / .6); }
  .v3 table { min-width:760px; }
  @media (max-width:900px) {
    .nav { flex-wrap:wrap; gap:8px; padding:8px 8px 8px 14px; }
    .merek img { height:34px; } .merek b { font-size:17px; } .merek .garis-v { height:26px; }
    .menu { order:3; width:100%; justify-content:space-between; margin:0; } .menu a { padding:0 6px; font-size:13px; }
    .kanan-nav { margin-left:auto; } .kanan-nav .tombol { display:none; }
    .pembuka { padding-top:48px; } .pembuka h1 { font-size:34px; }
    .halaman .isi { padding:12px 16px 32px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- Data contoh (fiktif) ----------
const K = [
  { n:'Survei dan pengukuran bidang tanah', p:'PT Contoh Geospasial', pks:'019/BBT/PKS/2025', v:'Rp 2,1 M', tgl:7, bln:'Nov', hari:'Sabtu', sisa:-10, st:'l' },
  { n:'Jasa penilaian aset', p:'KJPP Contoh', pks:'008/BBT/PKS/2026', v:'Rp 285 jt', tgl:9, bln:'Nov', hari:'Senin', sisa:-8, st:'l' },
  { n:'Kerja sama pemanfaatan lahan', p:'PT Contoh Agro Lestari', pks:'015/BBT/PKS/2026', v:'Rp 1,2 M', tgl:5, bln:'Des', hari:'Sabtu', sisa:18, st:'s' },
  { n:'Jasa konsultan hukum', p:'Kantor Hukum Contoh dan Rekan', pks:'027/BBT/PKS/2026', v:'Rp 640 jt', tgl:10, bln:'Des', hari:'Kamis', sisa:23, st:'s' },
  { n:'Pengembangan sistem informasi', p:'PT Contoh Solusi Digital', pks:'031/BBT/PKS/2026', v:'Rp 980 jt', tgl:14, bln:'Des', hari:'Senin', sisa:27, st:'s' },
  { n:'Pemeliharaan gedung kantor', p:'PT Contoh Graha Prima', pks:'036/BBT/PKS/2026', v:'Rp 450 jt', tgl:21, bln:'Jan', hari:'Kamis', sisa:65, st:'s' },
]
const LAIN = [
  { n:'Audit laporan keuangan', p:'KAP Contoh', pks:'044/BBT/PKS/2026', v:'Rp 310 jt', tgl:22, bln:'Mar', hari:'Senin', sisa:125, st:'j' },
  { n:'Kerja sama pengembangan kawasan', p:'PT Contoh Properti', pks:'040/BBT/PKS/2026', v:'Rp 2,4 M', tgl:7, bln:'Jul', hari:'Rabu', sisa:232, st:'j' },
]
const teksSisa = (k) => k.sisa < 0 ? `Lewat ${-k.sisa} hari` : `${k.sisa} hari lagi`
const warnaUbin = { l:'color-mix(in srgb,var(--tanah) 35%,white)', s:'color-mix(in srgb,var(--emas) 40%,white)', j:'color-mix(in srgb,var(--biru) 45%,white)' }
const warnaTanda = { l:'var(--tanah)', s:'var(--emas)', j:'var(--hijau)' }

// ---------- Gaya tabel ----------
const gaya = {
  1: (d, judul) => `<div class="v1"><div class="mozaik" data-mozaik></div><div class="kaca">
      <div class="judul-tabel"><h3>${judul}</h3><span class="pil-gelap">Lihat semua</span></div>
      <table><thead><tr><th>Kontrak</th><th>Berakhir</th><th>Nomor PKS</th><th class="kanan">Nilai</th><th>Status</th></tr></thead><tbody>
      ${d.map(k => `<tr><td class="nama"><b>${k.n}</b><span>${k.p}</span></td><td class="tgl"><b>${k.tgl} ${k.bln}</b><span>${k.hari}</span></td><td>${k.pks}</td><td class="kanan"><b>${k.v}</b></td><td><span class="titik t-${k.st}">${teksSisa(k)}</span></td></tr>`).join('')}
      </tbody></table></div></div>`,
  2: (d) => {
    const grup = [['l','Sudah lewat','var(--tanah)'],['s','Habis dalam 90 hari','var(--emas)'],['j','Berjalan','var(--hijau)']]
    return `<div class="v2"><div class="row hdr"><span></span><span>Kontrak</span><span>Penyedia</span><span>Nomor PKS</span><span class="kanan">Nilai</span><span class="kanan">Berakhir</span></div>
      ${grup.map(([st, label, w]) => { const isi = d.filter(k => k.st === st); if (!isi.length) return ''
        return `<div class="kelompok"><i class="ubin" style="background:${w}"></i>${label} <small>${isi.length}</small></div>` +
          isi.map(k => `<div class="row"><i class="ubin" style="background:${w}"></i><span class="n">${k.n}</span><span class="p">${k.p}</span><span class="k">${k.pks}</span><span class="kanan"><b>${k.v}</b></span><span class="kanan t-${k.st}"><b>${teksSisa(k)}</b></span></div>`).join('') }).join('')}</div>`
  },
  3: (d, judul) => `<div class="v3"><div class="judul-tabel" style="padding:12px 0 0"><h3>${judul}</h3><span class="pil-gelap">Lihat semua</span></div><table>
      <thead><tr><th>Kontrak</th><th class="kanan" style="padding-right:24px">Nilai</th><th><div class="skala"><span>17 Okt</span><span>Hari ini</span><span>16 Des</span><span>15 Feb</span></div></th></tr></thead><tbody>
      ${d.map(k => { const kiri = Math.max(3, Math.min(97, (k.sisa + 30) / 120 * 100))
        return `<tr><td class="nama"><b>${k.n}</b><span>${k.p}</span></td><td class="kanan" style="padding-right:24px"><b>${k.v}</b></td><td><div class="trek"><i class="rel"></i><i class="kini"></i><i class="tanda" style="left:${kiri}%;background:${warnaTanda[k.st]}"></i><span class="lbl t-${k.st}" style="left:${Math.max(14, Math.min(86, kiri))}%">${k.tgl} ${k.bln}, ${teksSisa(k).toLowerCase()}</span></div></td></tr>` }).join('')}
      </tbody></table></div>`,
  6: (d, judul) => `<div class="v6">${judul ? `<div class="judul-tabel" style="padding:8px 0 10px"><h3>${judul}</h3><span class="pil-gelap">Lihat semua</span></div>` : ''}
      ${d.map(k => `<div class="row"><div class="ubin-tgl" style="background:${warnaUbin[k.st]}"><b>${k.tgl}</b><small>${k.bln}</small></div><div class="nama"><b>${k.n}</b><span>${k.p}</span></div><span class="nama"><span>${k.pks}</span></span><span class="kanan"><b>${k.v}</b></span><span class="sisa kanan t-${k.st}"><b>${k.sisa < 0 ? -k.sisa : k.sisa} hari</b><small>${k.sisa < 0 ? 'sudah lewat' : k.st === 'j' ? 'berjalan' : 'lagi'}</small></span></div>`).join('')}</div>`,
}

const KOMBINASI = {
  1: { beranda:1, kontrak:6, nama:'Kombinasi 1: gaya 1 di Beranda + gaya 6 di Kontrak' },
  2: { beranda:6, kontrak:6, nama:'Kombinasi 2: gaya 6 di semua halaman' },
  3: { beranda:1, kontrak:1, nama:'Kombinasi 3: gaya 1 di semua halaman' },
  4: { beranda:3, kontrak:2, nama:'Kombinasi 4: gaya 3 di Beranda + gaya 2 di Kontrak' },
}
const k = KOMBINASI[new URLSearchParams(location.search).get('k')] || KOMBINASI[1]
const judulAgenda = 'Agenda <span class="serif">kontrak</span>'

const nav = (aktif) => `<nav class="nav"><div class="merek"><img src="/logo-bbt.png" alt="Badan Bank Tanah"><i class="garis-v"></i><b>Contract Management</b></div>
  <div class="menu">${['Beranda','Kontrak','Pengingat','Admin'].map(m => `<a class="${m === aktif ? 'aktif' : ''}">${m}${m === 'Pengingat' ? ' <span class="jml">6</span>' : ''}</a>`).join('')}</div>
  <div class="kanan-nav"><span class="av">AI</span><span class="tombol">+ Tambah kontrak</span></div></nav>`

document.getElementById('app').innerHTML = `
  <div class="halaman"><div class="bg-mozaik" data-mozaik-besar></div><div class="isi">
    ${nav('Beranda')}
    <section class="pembuka"><p class="tgl">Selasa, 17 November 2026</p>
      <h1>6 kontrak perlu <span class="serif">ditindaklanjuti</span></h1>
      <p class="ring">2 sudah lewat tanggal akhir dan 4 habis dalam 90 hari, senilai Rp 5,7 M.</p>
      <div class="cari"><span>Cari nama, penyedia, atau nomor PKS</span><em>Cari</em></div>
      <div class="pil-status"><span><i class="ubin" style="background:var(--tanah)"></i><b>2</b> Sudah lewat</span><span><i class="ubin" style="background:var(--emas)"></i><b>4</b> Segera habis</span><span><i class="ubin" style="background:var(--hijau)"></i><b>2</b> Berjalan</span><span><i class="ubin" style="background:var(--abu)"></i><b>1</b> Selesai</span></div>
    </section>
    <div class="bagian">${gaya[k.beranda](K, judulAgenda)}</div>
  </div></div>
  <div class="pemisah">Halaman Kontrak</div>
  <div class="halaman"><div class="bg-mozaik" data-mozaik-besar style="height:180px"></div><div class="isi">
    ${nav('Kontrak')}
    <div class="judul-hal"><div><h1>Kontrak</h1><p>8 kontrak tercatat</p></div></div>
    <div class="cari" style="margin:0;max-width:none"><span>Cari nama, penyedia, atau nomor PKS</span></div>
    <div class="chip"><span class="aktif">Semua 8</span><span>Sudah lewat 2</span><span>Segera habis 4</span><span>Berjalan 2</span></div>
    ${gaya[k.kontrak]([...K, ...LAIN], k.kontrak === 1 ? 'Semua <span class="serif">kontrak</span>' : '')}
  </div></div>
  <span class="label-kombinasi">${k.nama}</span>`

// Mozaik (pola tetap, warna BBT)
const warna = ['#13254F', '#2B4C9B', '#8FA8E8', '#ffffff', '#F2B829', '#E07B2C']
function isi(el, kolom, baris) {
  el.style.gridTemplateColumns = `repeat(${kolom}, 1fr)`
  for (let i = 0; i < kolom * baris; i++) {
    const x = i % kolom, y = Math.floor(i / kolom), t = x / (kolom - 1) * (warna.length - 1)
    const kiri = Math.floor(t), kanan = Math.min(warna.length - 1, kiri + 1), porsi = Math.round((1 - (t - kiri)) * 100)
    const pucat = Math.min(90, 32 + y * 15 + ((x * 7 + y * 3) % 5) * 6)
    const kotak = document.createElement('i')
    if ((x * 7 + y * 11) % 9 !== 0 && (x + y * 3) % 13 !== 4) kotak.style.background = `color-mix(in srgb, color-mix(in srgb, ${warna[kiri]} ${porsi}%, ${warna[kanan]}) ${100 - pucat}%, white)`
    el.appendChild(kotak)
  }
}
const hp = innerWidth <= 900
document.querySelectorAll('[data-mozaik-besar]').forEach(el => isi(el, hp ? 8 : 20, 5))
document.querySelectorAll('[data-mozaik]').forEach(el => isi(el, hp ? 10 : 24, 4))
</script>
</body>
</html>
