<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup rencana: Beranda, Kontrak, Pengingat, Tambah kontrak</title>
<!-- Buka dengan ?h=beranda | kontrak | pengingat | tambah. Data fiktif ("Contoh"). Hanya mockup, bukan kode aplikasi. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,500&display=swap">
<link rel="stylesheet" href="tabel-gaya.css">
<style>
  :root { --lewat:#E36A2E; --segera:#E0A100; }
  .wadah { padding-top:0; }
  .halaman { position:relative; min-height:100vh; }
  .bg-mozaik { position:absolute; inset:0 0 auto 0; height:300px; display:grid; gap:6px; padding:6px; overflow:hidden;
    -webkit-mask-image:linear-gradient(#000 25%,transparent 95%); mask-image:linear-gradient(#000 25%,transparent 95%); pointer-events:none; }
  .bg-mozaik.pendek { height:190px; }
  .bg-mozaik i { aspect-ratio:1; border-radius:10px; }
  .isi { position:relative; max-width:1120px; margin:0 auto; padding:24px 24px 56px; }

  /* Navbar: logo tetap, dirapikan; judul besar; ikut turun saat scroll */
  .nav { position:sticky; top:12px; z-index:5; display:flex; align-items:center; gap:22px; background:#fff; border:1px solid var(--garis); border-radius:22px; padding:10px 10px 10px 20px; box-shadow:0 12px 32px -18px rgb(19 37 79 / .35); }
  .merek { display:flex; align-items:center; gap:16px; }
  .merek img { height:46px; display:block; }
  .merek .garis-v { width:1px; height:36px; background:var(--garis); }
  .merek b { font-size:22px; font-weight:800; letter-spacing:-.03em; color:var(--navy); white-space:nowrap; }
  .menu { display:flex; gap:2px; margin:0 auto; }
  .menu a { white-space:nowrap; padding:0 14px; min-height:44px; display:inline-flex; align-items:center; gap:6px; border-radius:99px; color:var(--teks); text-decoration:none; font-weight:500; }
  .menu a.aktif { background:var(--sorot); color:var(--navy); font-weight:700; }
  .jml { background:var(--emas); color:var(--navy); font-size:11px; font-weight:700; border-radius:99px; padding:0 6px; }
  .kanan-nav { display:flex; align-items:center; gap:8px; }
  .av { width:40px; height:40px; border-radius:99px; background:var(--sorot); display:grid; place-items:center; font-weight:700; font-size:13px; color:var(--navy); }
  .tombol { background:var(--navy); color:#fff; border-radius:99px; height:48px; padding:0 22px; display:inline-flex; align-items:center; gap:8px; font-weight:600; white-space:nowrap; text-decoration:none; border:0; font:600 14px "Public Sans",sans-serif; }
  .tombol.kedua { background:#fff; color:var(--navy); border:1px solid #7D88A3; height:44px; }

  /* Pembuka Beranda (dinaikkan) */
  .pembuka { text-align:center; padding:84px 0 0; }
  .pembuka p.tgl { margin:0; color:var(--lembut); }
  .pembuka h1 { font-size:56px; line-height:1.05; margin:8px auto 0; max-width:900px; }
  .pembuka .ring { color:var(--lembut); font-size:16px; margin:12px 0 0; }
  .cari { display:flex; align-items:center; gap:8px; max-width:560px; margin:24px auto 0; background:#fff; border:1px solid #7D88A3; border-radius:99px; padding:6px 6px 6px 22px; box-shadow:0 12px 32px -18px rgb(19 37 79 / .35); min-height:52px; }
  .cari span { flex:1; text-align:left; color:var(--lembut); }
  .cari em { font-style:normal; background:var(--aksi); color:#fff; border-radius:99px; padding:12px 22px; font-weight:600; }
  .pil-status { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:18px 0 0; }
  .pil-status span { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 16px; border-radius:99px; background:#fff; border:1px solid var(--garis); }
  .pil-status b { font-size:16px; color:var(--navy); }

  .kepala-bagian { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:48px 0 16px; }
  .kepala-bagian h2 { margin:0; font-size:26px; font-weight:800; letter-spacing:-.03em; color:var(--navy); }
  .kepala-bagian a { color:var(--aksi); font-weight:600; text-decoration:none; }

  /* A: kartu bergrid */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .kartu { background:#fff; border:1px solid var(--garis); border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:14px; text-decoration:none; color:inherit; }
  .kartu .atas { display:flex; justify-content:space-between; align-items:flex-start; }
  .kal { width:58px; flex:none; border:1px solid var(--garis); border-radius:12px; overflow:hidden; text-align:center; background:#fff; }
  .kal i { display:block; font-style:normal; font-size:11px; font-weight:700; color:var(--navy); line-height:17px; }
  .kal b { display:block; font-size:24px; line-height:1; padding:5px 0 2px; color:var(--navy); }
  .kal small { display:block; font-size:11px; color:var(--lembut); padding-bottom:6px; }
  .p-l { background:var(--tanah); } .p-s { background:var(--emas); } .p-j { background:var(--sorot); } .p-x { background:#EEF1F5; }
  .angka { text-align:right; line-height:1; }
  .angka strong { display:block; font-size:44px; font-weight:800; letter-spacing:-.03em; }
  .angka small { font-size:13px; font-weight:600; }
  .kartu .nm { font-weight:700; font-size:16px; color:var(--navy); }
  .kartu .py { color:var(--lembut); font-size:13px; }
  .masa { height:6px; border-radius:99px; background:var(--garis-l); overflow:hidden; } .masa span { display:block; height:100%; border-radius:99px; }
  .kartu .bawah { display:flex; justify-content:space-between; font-size:13px; color:var(--lembut); }
  .kartu .bawah b { color:var(--navy); font-size:15px; }

  /* B: garis masa per bulan */
  .panel { background:#fff; border:1px solid var(--garis); border-radius:24px; padding:8px 28px 22px; }
  .bulan { display:grid; grid-template-columns:150px 1fr; gap:20px; padding-top:18px; }
  .bulan h3 { margin:6px 0 0; font-size:16px; color:var(--navy); }
  .bulan h3 small { display:block; color:var(--lembut); font-weight:400; font-size:13px; }
  .jalur { position:relative; padding-left:28px; border-left:2px solid var(--garis); }
  .butir { position:relative; display:flex; align-items:center; gap:14px; padding:10px 0; }
  .butir::before { content:""; position:absolute; left:-36px; width:12px; height:12px; border-radius:50%; background:#fff; border:3px solid var(--segera); }
  .butir.l::before { border-color:var(--lewat); } .butir.j::before { border-color:var(--hijau); } .butir.x::before { border-color:var(--abu); }
  .butir .info { flex:1; min-width:0; } .butir .info b { display:block; } .butir .info span { color:var(--lembut); font-size:13px; }
  .butir .tahap { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .butir .tahap em { font-style:normal; font-size:12px; border:1px solid var(--garis); border-radius:99px; padding:2px 9px; color:var(--lembut); }
  .butir .tahap em.ok { border-color:var(--navy); color:var(--navy); font-weight:600; }
  .pil { font-weight:700; font-size:13px; border-radius:99px; padding:5px 12px; white-space:nowrap; }
  .pil.l { background:var(--lewat-l); color:var(--lewat-t); } .pil.s { background:var(--segera-l); color:var(--segera-t); } .pil.j { background:var(--jalan-l); color:var(--jalan-t); } .pil.x { background:#EEF1F5; color:#4B5568; }
  .hari-ini { display:flex; align-items:center; gap:10px; margin:16px 0 0; color:var(--navy); font-weight:700; font-size:13px; }
  .hari-ini::before, .hari-ini::after { content:""; flex:1; height:2px; background:var(--navy); }

  .judul-hal { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding:56px 0 20px; }
  .judul-hal h1 { font-size:34px; margin:0; } .judul-hal p { margin:6px 0 0; color:var(--lembut); max-width:640px; }
  .alat { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:14px 0 18px; }
  .chip { display:flex; gap:8px; flex-wrap:wrap; }
  .chip span { border:1px solid var(--garis); background:#fff; border-radius:99px; padding:9px 14px; font-weight:600; font-size:13px; }
  .chip span.aktif { border-color:var(--navy); background:var(--sorot); color:var(--navy); }
  .urut { font-weight:600; font-size:13px; color:var(--navy); }

  /* Tambah kontrak */
  .form-tata { display:grid; grid-template-columns:200px minmax(0,1fr) 300px; gap:24px; align-items:start; }
  .langkah { position:sticky; top:100px; display:flex; flex-direction:column; gap:4px; }
  .langkah a { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:99px; color:var(--lembut); font-weight:600; text-decoration:none; }
  .langkah a span { width:28px; height:28px; border-radius:99px; display:grid; place-items:center; background:#fff; border:1px solid var(--garis); color:var(--navy); font-size:13px; font-weight:800; flex:none; }
  .langkah a.aktif { background:var(--sorot); color:var(--navy); } .langkah a.aktif span { background:var(--navy); color:#fff; border-color:var(--navy); }
  .langkah a.ok span { background:var(--jalan-l); border-color:var(--jalan-l); color:var(--jalan-t); }
  .form { display:flex; flex-direction:column; gap:16px; }
  .bagian-form { background:#fff; border:1px solid var(--garis); border-radius:24px; padding:22px 24px; }
  .bagian-form h2 { margin:0 0 4px; font-size:20px; font-weight:800; letter-spacing:-.02em; color:var(--navy); }
  .bagian-form p.k { margin:0 0 16px; color:var(--lembut); font-size:13px; }
  .kolom { display:grid; gap:14px; } .kolom.dua { grid-template-columns:1fr 1fr; } .kolom.tiga { grid-template-columns:1fr 1fr 1fr; }
  .isian label { display:block; font-weight:600; font-size:13px; margin-bottom:6px; color:var(--navy); } .isian label i { color:#9F2430; font-style:normal; }
  .isian div { border:1px solid #7D88A3; border-radius:12px; height:46px; display:flex; align-items:center; padding:0 14px; color:var(--teks); background:#fff; }
  .isian div.kosong { color:var(--lembut); }
  .isian small { display:block; color:var(--lembut); font-size:12px; margin-top:5px; }
  .info-pengingat { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px; padding:12px 14px; border-radius:16px; background:var(--sorot); color:var(--navy); font-size:13px; }
  .info-pengingat em { font-style:normal; background:#fff; border-radius:99px; padding:3px 10px; font-weight:700; }
  .unggah { border:2px dashed #7D88A3; border-radius:20px; padding:18px; display:flex; align-items:center; gap:14px; background:var(--latar); }
  .unggah b { display:block; } .unggah span { color:var(--lembut); font-size:13px; }
  .aksi-form { display:flex; justify-content:flex-end; gap:10px; margin-top:4px; }
  .pratinjau { position:sticky; top:100px; }
  .pratinjau h3 { margin:0 0 4px; font-size:16px; color:var(--navy); }
  .pratinjau p { margin:0 0 12px; color:var(--lembut); font-size:13px; }

  @media (max-width:900px) {
    .nav { flex-wrap:wrap; gap:8px; padding:8px 8px 8px 14px; }
    .merek img { height:34px; } .merek b { font-size:17px; } .merek .garis-v { height:26px; }
    .menu { order:3; width:100%; justify-content:space-between; margin:0; } .menu a { padding:0 6px; font-size:13px; }
    .kanan-nav { margin-left:auto; } .kanan-nav .tombol { display:none; }
    .isi { padding:12px 16px 40px; }
    .pembuka { padding-top:48px; } .pembuka h1 { font-size:34px; }
    .grid { grid-template-columns:1fr; }
    .bulan { grid-template-columns:1fr; gap:8px; }
    .panel { padding:8px 16px 18px; }
    .butir { flex-wrap:wrap; } .butir .pil { margin-left:72px; }
    .judul-hal { padding-top:32px; } .judul-hal h1 { font-size:28px; }
    .form-tata { grid-template-columns:1fr; } .langkah { position:static; flex-direction:row; overflow-x:auto; } .langkah a { white-space:nowrap; }
    .kolom.dua, .kolom.tiga { grid-template-columns:1fr; } .pratinjau { position:static; }
  }

  /* ===== Variasi halaman kerja (lebih tenang dan padat) ===== */
  .label-var { position:fixed; right:16px; bottom:16px; z-index:9; background:var(--navy); color:#fff; border-radius:99px; padding:10px 18px; font-weight:700; box-shadow:0 12px 28px -12px rgb(19 37 79 / .6); }
  /* overflow:clip (bukan hidden) supaya judul bulan tetap bisa menempel saat di-scroll */
  .tabel { background:#fff; border:1px solid var(--garis); border-radius:24px; overflow:clip; }
  .t-kepala, .t-baris { display:grid; grid-template-columns:44px minmax(0,1.8fr) 150px 110px 110px 120px; gap:16px; align-items:center; padding:0 24px; }
  .t-kepala { min-height:44px; font-size:12px; font-weight:600; color:var(--lembut); border-bottom:1px solid var(--garis); }
  .t-baris { min-height:58px; border-top:1px solid var(--garis-l); }
  .t-baris:hover { background:var(--latar); }
  .t-baris .n { font-weight:600; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t-baris .py { display:block; color:var(--lembut); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t-baris .redup { color:var(--lembut); font-size:13px; }
  .t-bulan { position:sticky; top:92px; z-index:2; display:flex; align-items:baseline; gap:10px; padding:10px 24px; background:var(--latar); border-top:1px solid var(--garis); font-weight:700; color:var(--navy); font-size:13px; }
  .t-bulan small { color:var(--lembut); font-weight:500; }
  .t-kini { display:flex; align-items:center; gap:10px; padding:0 24px; height:30px; font-size:12px; font-weight:700; color:var(--navy); }
  .t-kini::after { content:""; flex:1; height:2px; background:var(--navy); border-radius:2px; }
  .ubin-kecil { width:40px; height:40px; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; color:var(--navy); }
  .ubin-kecil b { font-size:16px; font-weight:800; } .ubin-kecil small { font-size:10px; font-weight:700; margin-top:2px; }
  .u-l { background:color-mix(in srgb,var(--tanah) 32%,white); } .u-s { background:color-mix(in srgb,var(--emas) 38%,white); } .u-j { background:color-mix(in srgb,var(--biru) 40%,white); }
  .tanda { width:10px; height:10px; border-radius:3px; display:inline-block; }
  .tanda.l { background:var(--tanah); } .tanda.s { background:var(--emas); } .tanda.j { background:var(--hijau); }
  /* Varian B: tanpa ubin, baris lebih tipis */
  .tb .t-kepala, .tb .t-baris { grid-template-columns:minmax(0,2fr) 150px 110px 120px 110px; }
  .tb .t-baris { min-height:50px; }
  .tb .namaku { display:flex; align-items:center; gap:10px; min-width:0; }
  /* Pengingat */
  .kelompok-p { margin-top:22px; }
  .kelompok-p h2 { margin:0 0 10px; display:flex; align-items:baseline; gap:10px; font-size:20px; font-weight:800; letter-spacing:-.02em; color:var(--navy); }
  .kelompok-p h2 small { font-size:14px; font-weight:500; color:var(--lembut); letter-spacing:0; }
  .p-baris { display:grid; grid-template-columns:44px minmax(0,1.6fr) 240px 110px 120px; gap:16px; align-items:center; padding:0 24px; min-height:60px; border-top:1px solid var(--garis-l); }
  .p-baris:first-child { border-top:0; }
  .titik3 { display:inline-flex; gap:4px; vertical-align:middle; margin-right:8px; }
  .titik3 i { width:8px; height:8px; border-radius:99px; border:2px solid var(--navy); }
  .titik3 i.ok { background:var(--navy); }
  .ringkas-p { display:flex; gap:12px; flex-wrap:wrap; margin:0 0 18px; }
  .ringkas-p div { background:#fff; border:1px solid var(--garis); border-radius:20px; padding:14px 18px; flex:1; min-width:220px; }
  .ringkas-p b { display:block; font-size:28px; font-weight:800; letter-spacing:-.03em; color:var(--navy); }
  .ringkas-p span { color:var(--lembut); font-size:13px; }
  /* Tambah: dua kolom */
  .form2 { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:start; }
  .form-panel { background:#fff; border:1px solid var(--garis); border-radius:24px; padding:8px 28px 24px; }
  .seksi { padding:20px 0; border-top:1px solid var(--garis-l); }
  .seksi:first-child { border-top:0; }
  .seksi h2 { margin:0 0 14px; display:flex; align-items:center; gap:10px; font-size:18px; font-weight:800; letter-spacing:-.02em; color:var(--navy); }
  .seksi h2 .nomor { width:26px; height:26px; border-radius:99px; background:var(--sorot); display:grid; place-items:center; font-size:12px; }
  .seksi h2 small { font-size:13px; font-weight:500; color:var(--lembut); letter-spacing:0; }
  .petunjuk { color:var(--lembut); font-size:12px; margin-top:6px; }
  .samping { position:sticky; top:100px; display:flex; flex-direction:column; gap:14px; }
  .langkah-ringkas { background:#fff; border:1px solid var(--garis); border-radius:20px; padding:10px; }
  .langkah-ringkas a { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:99px; color:var(--lembut); font-weight:600; font-size:13px; }
  .langkah-ringkas a.aktif { background:var(--sorot); color:var(--navy); }
  .langkah-ringkas a i { width:20px; height:20px; border-radius:99px; border:2px solid var(--garis); display:grid; place-items:center; font-style:normal; font-size:11px; }
  .langkah-ringkas a.ok i { background:var(--hijau); border-color:var(--hijau); color:#fff; }
  .langkah-ringkas a.aktif i { border-color:var(--navy); }
  .bilah-aksi { position:sticky; bottom:12px; margin-top:16px; display:flex; justify-content:space-between; align-items:center; gap:10px; background:#fff; border:1px solid var(--garis); border-radius:99px; padding:8px 8px 8px 20px; box-shadow:0 12px 32px -18px rgb(19 37 79 / .35); }
  .bilah-aksi span.k { color:var(--lembut); font-size:13px; }
  @media (max-width:900px) {
    .t-kepala { display:none; }
    .t-baris { grid-template-columns:40px minmax(0,1fr) auto; padding:10px 16px; gap:4px 12px; }
    .t-baris > :nth-child(3), .t-baris > :nth-child(5) { display:none; }
    .t-baris > :nth-child(4) { grid-column:2; grid-row:2; text-align:left !important; font-size:13px; }
    .t-baris > :nth-child(6) { grid-column:3; grid-row:1 / span 2; }
    .ubin-kecil { grid-row:1 / span 2; }
    .tb .t-baris { grid-template-columns:minmax(0,1fr) auto; }
    .tb .t-baris > :nth-child(2), .tb .t-baris > :nth-child(4) { display:none; }
    .tb .t-baris > :nth-child(3) { grid-column:1; grid-row:2; font-size:13px; }
    .tb .t-baris > :nth-child(5) { grid-column:2; grid-row:1 / span 2; }
    .t-bulan, .t-kini { padding-left:16px; padding-right:16px; } .t-bulan { top:118px; }
    .p-baris { grid-template-columns:40px minmax(0,1fr) auto; padding:10px 16px; gap:4px 12px; }
    .p-baris > :nth-child(3) { grid-column:2 / span 2; grid-row:2; font-size:12px; }
    .p-baris > :nth-child(4) { display:none; } .p-baris > :nth-child(5) { grid-column:3; grid-row:1; }
    .form2 { grid-template-columns:1fr; } .samping { position:static; order:-1; } .langkah-ringkas { display:none; }
    .form-panel { padding:4px 16px 18px; }
    .bilah-aksi span.k { display:none; }
  }

  /* ===== Kontrak gabungan (Kontrak + Pengingat): tabel terpisah per tahap ===== */
  .tahap { margin-top:28px; }
  .tahap-kepala { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:12px; }
  .tahap-kepala h2 { margin:0; display:flex; align-items:baseline; gap:10px; font-size:22px; font-weight:800; letter-spacing:-.02em; color:var(--navy); }
  .tahap-kepala h2 small { font-size:15px; font-weight:600; color:var(--lembut); letter-spacing:0; }
  .tahap-kepala p { margin:4px 0 0; color:var(--lembut); font-size:14px; }
  .daftar-a { background:#fff; border:1px solid var(--garis); border-radius:24px; padding:6px 28px; }
  .baris-a { display:grid; grid-template-columns:58px minmax(0,1fr) 170px 110px 130px 20px; gap:20px; align-items:center; padding:14px 0; border-top:1px solid var(--garis-l); }
  .baris-a:first-child { border-top:0; }
  .baris-a .nm { display:block; font-weight:600; font-size:16px; color:var(--navy); }
  .baris-a .py { color:var(--lembut); font-size:14px; }
  .baris-a .pks { color:var(--lembut); font-size:14px; }

          <div class="kolom tiga">${isianX('Awal kontrak', '15 Feb 2026')}${isianX('Akhir kontrak', '14 Des 2026', true, 'Pengingat 14 Sep, 14 Okt, 14 Nov.')}${isianX('Nilai kontrak', 'Rp 980.000.000')}</div></div>
        <div class="seksi"><h2 style="font-size:16px"><span class="nomor">3</span>Monitoring dan catatan</h2>
          <div class="kolom tiga">${isianX('Monitoring', 'Uji coba 80%', false)}${isianX('Catatan', 'Pelatihan pengguna dijadwalkan', false)}${isianX('Keterangan', '', false)}</div></div>
        <div class="catatan-ubah">Critical point dan dokumen PDF diubah di halaman detail kontrak.</div>
        <div class="aksi-form" style="margin-top:18px"><span class="tombol kedua">Batal</span><span class="tombol">Simpan perubahan</span></div>
      </section></div>
  </div>`,
})

const h = new URLSearchParams(location.search).get('h') || 'beranda'
document.getElementById('app').innerHTML = `<div class="halaman">${(HALAMAN[h] || HALAMAN.beranda)()}</div>`

// Mozaik (pola tetap, warna BBT)
const warna = ['#13254F', '#2B4C9B', '#8FA8E8', '#ffffff', '#F2B829', '#E07B2C']
const hp = innerWidth <= 900
document.querySelectorAll('[data-mozaik]').forEach((el) => {
  const kolom = hp ? 8 : 20, baris = Math.ceil(el.clientHeight / (innerWidth / kolom)) + 1
  el.style.gridTemplateColumns = `repeat(${kolom}, 1fr)`
  for (let i = 0; i < kolom * baris; i++) {
    const x = i % kolom, y = Math.floor(i / kolom), t = x / (kolom - 1) * (warna.length - 1)
    const kiri = Math.floor(t), kanan = Math.min(warna.length - 1, kiri + 1), porsi = Math.round((1 - (t - kiri)) * 100)
    // Dua baris teratas boleh pekat; mulai baris ketiga (tempat judul halaman) dibuat sangat pudar supaya teks tetap terbaca.
    const pucat = y < 2 ? 32 + y * 15 + ((x * 7 + y * 3) % 5) * 6 : Math.min(95, 82 + (y - 2) * 3 + ((x * 7 + y * 3) % 5) * 2)
    const kotak = document.createElement('i')
    if ((x * 7 + y * 11) % 9 !== 0 && (x + y * 3) % 13 !== 4) kotak.style.background = `color-mix(in srgb, color-mix(in srgb, ${warna[kiri]} ${porsi}%, ${warna[kanan]}) ${100 - pucat}%, white)`
    el.appendChild(kotak)
  }
})
</script>
